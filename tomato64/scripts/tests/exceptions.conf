# exceptions.conf -- differences divergence-check.sh should not flag.
#
# Branding (FreshTomato -> Tomato64, any case, including the freshtomato.org /
# tomato64.org URLs), pure re-indentation, and pure additions are handled in the
# analyser itself and never need a rule here.
#
# Rule syntax -- <path-glob> is matched against "<package>/<file>":
#
#   ignore-file <path-glob>
#       Skip the file completely.  Use for files that were deliberately
#       rewritten wholesale rather than adapted line by line.
#
#   ignore-line <path-glob> <regex>
#       Any changed line matching the regex, on either side of the diff, is not
#       flagged.  Python regex syntax.
#
#   ignore-hunk <path-glob> <regex>
#       If any line in a change block matches, the whole block is skipped.  Use
#       when a rewrite spans several lines and no single line pattern covers it.
#


# ---------------------------------------------------------------------------
# Active rules
# ---------------------------------------------------------------------------

# Buildroot recipes, not FreshTomato build system.  Divergence is total and
# intentional; there is nothing to line up against upstream.
ignore-file  httpd/Makefile
ignore-file  libshared/Makefile
ignore-file  rc/Makefile
ignore-file  nvram/Makefile
ignore-file  rstats/Makefile
ignore-file  cstats/Makefile
ignore-file  mdu/Makefile
ignore-file  wanuptime/Makefile
ignore-file  sd-idle/Makefile
ignore-file  udevtrigger/Makefile
ignore-file  openvpn_plugin_auth_nvram/Makefile
ignore-file  hotplug2/common.mak

# libc feature-macro probing: FreshTomato is uClibc/glibc only, Tomato64 also
# builds against musl, so the __USE_GNU guard had to be reworked in place.
ignore-file  httpd/cgi.c

# www/Makefile is adapted line by line rather than rewritten, and FreshTomato
# touches it whenever a page is added, so it stays compared.  These are the
# Buildroot-specific edits.
ignore-line  www/Makefile  ^include \.\./common\.mak$
ignore-line  www/Makefile  ^#?\s*rm -rf \$\(INSTALLDIR\)/www$
ignore-line  www/Makefile  ^#?\s*chmod 0644 \$\(INSTALLDIR\)/www/\*$
ignore-line  www/Makefile  TCONFIG_TOMATO64
ignore-line  www/Makefile  tools-shell-legacy\.asp
ignore-line  www/Makefile  BR2_EXTERNAL_TOMATO64_PATH

# Rewritten for Tomato64 (version/kernel/build-commit lines, no donation block).
ignore-file  www/about.asp

# Tomato64's own xterm-based shell.  FreshTomato's page is kept as
# tools-shell-legacy.asp, which differs from it only by branding.
ignore-file  www/tools-shell.asp

# Theme banners carry the Tomato64 logo as an inline SVG background.
ignore-line  www/*.css  ^\s*background:\s*url\("data:image/svg\+xml;base64,

# Help links point at the Tomato64 wiki, whose URL layout differs.
ignore-line  www/tomato.js  ^\s*const url = 'https://(wiki\.freshtomato\.org/doku\.php|tomato64\.org/wiki)';

# Tomato64 favicon.
ignore-file  www/favicon.ico

# Donation image, unused in Tomato64 (about.asp has no donation block).
ignore-file  www/donate.gif

# wg_lan widened to 0-255 (more bridges).  The upstream entry sits inside a
# macro, where #ifndef cannot be used, so it is commented out in place.
ignore-line  httpd/tomato.c  ^/\* #ifndef TOMATO64 \\$

# others/Makefile is adapted line by line, like www/Makefile.
ignore-line  others/Makefile  ^include \.\./common\.mak$
ignore-line  others/Makefile  for F in .* webmon_bkp

# Login banner credits the Tomato64 builder.
ignore-line  others/mymotd  ^\s*echo -e "Built on .* by (Pedro|Lance)"$
